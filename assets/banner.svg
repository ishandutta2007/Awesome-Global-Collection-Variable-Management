<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="0" r="1.5" fill="#475569" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .code-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- DYNAMIC ANIMATED BACKGROUND ORBS (behind content) -->
  <g opacity="0.4">
    <!-- Orb 1: Cyan Glow -->
    <circle cx="150" cy="100" r="130" fill="#06b6d4" filter="url(#glow)">
      <animate attributeName="cx" values="150;250;150" dur="14s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;160;100" dur="12s" repeatCount="indefinite" />
      <animate attributeName="r" values="130;160;130" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="10s" repeatCount="indefinite" />
    </circle>
    <!-- Orb 2: Purple Glow -->
    <circle cx="1050" cy="300" r="140" fill="#a855f7" filter="url(#glow)">
      <animate attributeName="cx" values="1050;950;1050" dur="16s" repeatCount="indefinite" />
      <animate attributeName="cy" values="300;220;300" dur="14s" repeatCount="indefinite" />
      <animate attributeName="r" values="140;170;140" dur="11s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="12s" repeatCount="indefinite" />
    </circle>
    <!-- Orb 3: Indigo Center Pulse -->
    <circle cx="600" cy="200" r="180" fill="#4f46e5" filter="url(#glow)">
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="8s" repeatCount="indefinite" />
      <animate attributeName="r" values="180;210;180" dur="9s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- DYNAMIC ANIMATED DATA FLOW PULSES (background/bottom) -->
  <g opacity="0.5">
    <path d="M 50 350 L 1150 350" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" />
    <circle cx="50" cy="350" r="4" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="cx" values="50;1150" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="50" cy="350" r="3" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="cx" values="50;1150" dur="7s" begin="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed high contrast and non-overlapping -->

  <!-- Top Pill / Status Tag -->
  <g transform="translate(60, 48)">
    <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="16" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="21" class="badge-text" fill="#38bdf8">GLOBAL &amp; COLLECTION VARS</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="132" class="title-text" fill="url(#textGrad)">Awesome Variable Management</text>

  <!-- Subtitle -->
  <text x="60" y="172" class="subtitle-text">Curated Ecosystem for Secrets Management, Environment Variables &amp; Vaults</text>

  <!-- Decorative Accent Bar -->
  <rect x="60" y="196" width="160" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Dynamic Feature Badges / Architecture Pills -->
  <g transform="translate(60, 226)">
    <!-- Pill 1: Postman Scopes -->
    <g transform="translate(0, 0)">
      <rect width="210" height="38" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="16" y="24" class="code-text">🌐 Global &amp; Collection</text>
    </g>

    <!-- Pill 2: Runtime Injection -->
    <g transform="translate(225, 0)">
      <rect width="190" height="38" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="16" y="24" class="code-text">⚡ Runtime Injection</text>
    </g>

    <!-- Pill 3: Vaults & Dynamic Leases -->
    <g transform="translate(430, 0)">
      <rect width="180" height="38" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="16" y="24" class="code-text">🔐 Self-Hosted Vaults</text>
    </g>

    <!-- Pill 4: GitOps Encryption -->
    <g transform="translate(625, 0)">
      <rect width="190" height="38" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="16" y="24" class="code-text">🛡️ GitOps Encrypted .env</text>
    </g>
  </g>

  <!-- Floating Stats / Feature Cards on the Right Side (Glassmorphism) -->
  <g transform="translate(865, 52)" filter="url(#cardShadow)">
    <rect width="275" height="190" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    
    <!-- Card Header -->
    <circle cx="24" cy="24" r="5" fill="#ef4444" />
    <circle cx="40" cy="24" r="5" fill="#f59e0b" />
    <circle cx="56" cy="24" r="5" fill="#10b981" />
    <line x1="15" y1="42" x2="260" y2="42" stroke="#334155" stroke-width="1" />

    <!-- Card Content -->
    <text x="20" y="68" class="code-text" fill="#94a3b8">$ doppler run -- app</text>
    <text x="20" y="94" class="code-text" fill="#34d399">✓ 42 secrets injected</text>
    <text x="20" y="120" class="code-text" fill="#94a3b8">$ vault kv get secret/prod</text>
    <text x="20" y="146" class="code-text" fill="#818cf8">✓ Lease granted (TTL: 1h)</text>
    <text x="20" y="172" class="code-text" fill="#f43f5e">🔒 Zero plaintext in Git</text>
  </g>

  <!-- Border Highlight -->
  <rect width="1200" height="420" rx="16" fill="none" stroke="#475569" stroke-width="1" stroke-opacity="0.4" />
</svg>
